<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ПР3_2</title>
</head>
<body>
    <script>
        function greet(greeting) {
            return greeting + ', my name is ' + this.name;
        }

        const character = {
            name: 'Pikachu',
            greet: greet
        };

        const enemy = {
            name: 'Charmander',
            greet: greet
        };

        console.log(character.greet('Hi'));
        console.log(enemy.greet('Hi'))

        console.log(enemy.greet.call(character, 'Hello'));
        console.log(enemy.greet.apply(character, ['Hihi']));
    </script>
</body>
</html>
